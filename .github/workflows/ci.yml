name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v6.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@395ad32f4fac0653f9da2f6c8d098dbf9c1542bc # v6.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: cp .env.example .env

      - run: npm ci --ignore-scripts

      - run: npm run lint:ci

      - run: npm run tsc

      - run: npm run docker:test-container-up

      - name: Setup test database
        run: |
          cp .env.test .env
          npx prisma db push --force-reset --accept-data-loss
        env:
          DATABASE_URL: postgresql://engine:password@localhost:5440/engine-test

      - run: npm run test:ci
        env:
          DATABASE_URL: postgresql://engine:password@localhost:5440/engine-test

      - run: npm run docker:test-container-down

      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
