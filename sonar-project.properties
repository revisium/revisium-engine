sonar.projectKey=revisium_revisium-engine
sonar.organization=revisium

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  **/__tests__**,\
  **/__mocks__**,\
  **/*.spec.ts,\
  prisma/**/*,\
  src/__generated__/**

sonar.coverage.exclusions=\
  **/__tests__**,\
  **/__mocks__**,\
  **/*.spec.ts,\
  prisma/**/*,\
  src/__generated__/**,\
  src/**/*.module.ts,\
  src/main.ts,\
  src/**/index.ts

sonar.cpd.exclusions=\
  **/__tests__**,\
  **/__mocks__**,\
  **/*.spec.ts,\
  src/__generated__/**

sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# CQRS: empty command classes
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2094
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**/*.command.ts

# CQRS: empty query classes
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2094
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**/*.query.ts

# CQRS: command files with single class
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e3.resourceKey=src/**/*.command.ts

# CQRS: query files with single class
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e4.resourceKey=src/**/*.query.ts
