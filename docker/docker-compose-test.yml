services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5440:5432'
    environment:
      POSTGRES_DB: engine-test
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U engine -d engine-test']
      interval: 5s
      timeout: 5s
      retries: 5
