name: CI

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: cp .env.example .env

      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild sharp @swc/core @prisma/engines prisma

      - run: pnpm run lint:ci

      - run: pnpm run tsc

      - run: pnpm run docker:test-container-up

      - name: Setup test database
        run: |
          cp .env.test .env
          pnpm exec prisma db push --force-reset --accept-data-loss
        env:
          DATABASE_URL: postgresql://engine:password@localhost:5440/engine-test

      - name: Restore jest cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .jest-cache
          key: jest-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            jest-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            jest-cache-${{ runner.os }}-

      - run: pnpm run test:ci
        env:
          DATABASE_URL: postgresql://engine:password@localhost:5440/engine-test

      - run: pnpm run docker:test-container-down

      - uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
