sonar.projectKey=revisium_revisium-engine
sonar.organization=revisium

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  **/__tests__**,\
  **/__mocks__**,\
  **/*.spec.ts,\
  prisma/**/*,\
  src/__generated__/**

sonar.coverage.exclusions=\
  **/__tests__**,\
  **/__mocks__**,\
  **/*.spec.ts,\
  prisma/**/*,\
  src/__generated__/**,\
  src/**/*.module.ts,\
  src/main.ts,\
  src/**/index.ts

sonar.cpd.exclusions=\
  **/__tests__**,\
  **/__mocks__**,\
  **/*.spec.ts,\
  src/__generated__/**

sonar.issue.ignore.multicriteria=e1,e2

# CQRS: empty command/query classes
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2094
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**/*.{command,query}.ts

# CQRS: command/query files with single class
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**/*.{command,query}.ts
