services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5439:5432'
    environment:
      POSTGRES_DB: engine-dev
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: password
    volumes:
      - engine-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U engine -d engine-dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  engine-db-data:
